<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
<script>(function(){var t=localStorage.getItem("rankingdigi-theme")||(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark");document.documentElement.setAttribute("data-theme",t);})();</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista do deck — RankingDigi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/styles/app.css">
    <link rel="stylesheet" href="/styles/deckbuilder.css">
</head>
<body data-page="ranking">
    <main class="container-fluid py-4">
        <header class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
            <div>
                <h1 class="page-title">
                    <span class="icon-badge"><i class="bi bi-layers-fill"></i></span>
                    <span id="deckTitle">Lista do deck</span>
                </h1>
                <p class="page-subtitle mt-2" id="pageSubtitle">Carregando…</p>
            </div>
            <a href="#" id="backLink" class="btn btn-secondary"><i class="bi bi-arrow-left"></i> Voltar ao resumo</a>
        </header>

        <div id="errorBlock" style="display:none;">
            <div class="card-app">
                <div class="card-body text-center">
                    <i class="bi bi-exclamation-octagon" style="font-size:3rem; color: var(--danger);"></i>
                    <h2 style="font-size:1.3rem; margin-top:1rem;">Não foi possível abrir a lista</h2>
                    <p class="text-muted-2" id="errorText"></p>
                </div>
            </div>
        </div>

        <section id="deckBlock" style="display:none;">
            <div class="card-app mb-3">
                <div class="card-body d-flex flex-wrap align-items-center gap-3">
                    <div class="d-flex align-items-center gap-2 flex-grow-1" style="min-width:220px;">
                        <span id="playerAvatar"></span>
                        <div>
                            <div style="font-weight:600;" id="playerName"></div>
                            <div class="text-muted-2" style="font-size:0.85rem;" id="deckName"></div>
                        </div>
                    </div>
                    <div class="d-flex gap-3">
                        <div class="deck-counter" id="mainCounter">Principal: 0</div>
                        <div class="deck-counter" id="digiEggCounter">Digi-Egg: 0</div>
                    </div>
                    <span class="text-muted-2" style="font-size:0.8rem;">
                        <i class="bi bi-zoom-in"></i> Passe o mouse sobre uma carta para ampliar
                    </span>
                </div>
            </div>

            <section class="card-app">
                <div class="card-header"><i class="bi bi-list-ul"></i> Cartas do deck</div>
                <div class="card-body">
                    <h3 class="deck-zone-title">Deck principal <span class="text-muted-2" id="mainZoneCount">(0)</span></h3>
                    <div id="mainZoneList" class="deck-card-list"></div>

                    <h3 class="deck-zone-title mt-4">Digi-Egg <span class="text-muted-2" id="digiEggZoneCount">(0)</span></h3>
                    <div id="digiEggZoneList" class="deck-card-list"></div>
                </div>
            </section>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/scripts/auth.js"></script>
    <!-- ?v= pelo mesmo motivo do decks.html: esta tela depende do initCardHoverPreview() do common.js -->
    <script src="/scripts/common.js?v=2"></script>
    <script src="/scripts/theme.js"></script>
    <script src="/scripts/deck-view.js"></script>
</body>
</html>
